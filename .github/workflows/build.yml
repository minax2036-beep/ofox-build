name: Build OrangeFox Recovery
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 rsync curl zip unzip tar ccache lz4 python3 repo

      - name: Cache OrangeFox Source & CCache
        id: cache-ofox
        uses: actions/cache@v4
        with:
          path: |
            ~/ofox
            ~/.ccache
          key: ofox-14-1-slim-v1
          restore-keys: |
            ofox-14-1-slim-

      - name: Setup Repo & Sync OrangeFox
        if: steps.cache-ofox.outputs.cache-hit != 'true'
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          P1="ht"
          P2="tps://"
          S1="gitlab"
          S2=".com/OrangeFox/sync.git"
          git clone "${P1}${P2}${S1}${S2}" ~/sync
          cd ~/sync
          ./orangefox_sync.sh --branch 14.1 --path ~/ofox
          rm -rf ~/ofox/.repo ~/ofox/prebuilts/clang/host/linux-x86/clang-r*/*test*

      - name: Clone & Patch Device Tree
        run: |
          rm -rf ~/ofox/device/alps/mgvi_64_64only_ww_armv82
          cd ~/ofox
          P1="ht"
          P2="tps://"
          G1="github"
          G2=".com/minax2036-beep/device_nothing_Galaxian.git"
          git clone "${P1}${P2}${G1}${G2}" device/alps/mgvi_64_64only_ww_armv82
          cd device/alps/mgvi_64_64only_ww_armv82
          mv omni_mgvi_64_64only_ww_armv82.mk twrp_mgvi_64_64only_ww_armv82.mk
          sed -i 's/vendor\/omni/vendor\/twrp/g' twrp_mgvi_64_64only_ww_armv82.mk
          sed -i 's/omni_/twrp_/g' AndroidProducts.mk twrp_mgvi_64_64only_ww_armv82.mk
          sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/d' device.mk

      - name: Build OrangeFox
        run: |
          cd ~/ofox
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 3G
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=mgvi_64_64only_ww_armv82
          export LC_ALL="C"
          source build/envsetup.sh
          lunch twrp_mgvi_64_64only_ww_armv82-ap2a-eng
          mka adbd vendorbootimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Galaxian
          path: |
            ~/ofox/out/target/product/mgvi_64_64only_ww_armv82/OrangeFox*.zip
            ~/ofox/out/target/product/mgvi_64_64only_ww_armv82/vendor_boot.img

